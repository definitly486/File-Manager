name: Release APK (main)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # local.properties is committed with a developer SDK path that does not exist on the runner
      - name: Remove local SDK path
        run: rm -f local.properties

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION_CODE=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # Optional: sign with your own key. Add these repository secrets to enable it:
      #   KEYSTORE_BASE64 (base64 of the .jks file), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Without them the release APK is signed with the debug keystore (installable, but the
      # key changes on every run, so the previous build must be uninstalled first).
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not set, signing with the debug keystore"
          fi

      - name: Build release APK (signed with own key)
        if: steps.keystore.outputs.enabled == 'true'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFossRelease --no-daemon

      - name: Build release APK (debug keystore)
        if: steps.keystore.outputs.enabled != 'true'
        run: ./gradlew assembleFossRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          echo "Found: $APK"
          cp "$APK" "dist/FileManager-${{ steps.version.outputs.name }}-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
