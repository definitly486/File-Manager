name: Build APK (wifidirect)

on:
  push:
    branches: [ wifidirect, wifidirect-picker-style ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # local.properties is committed with a developer SDK path that does not exist on the runner
    - name: Remove local SDK path
      run: rm -f local.properties

    # Without keystore.properties the release build is signed with the debug keystore,
    # so the APK is installable. The key is new on every run, uninstall the previous build first.
    - name: Build release APK
      run: ./gradlew assembleFossRelease --no-daemon

    - name: Collect APK
      run: |
        mkdir -p dist
        APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
        echo "Found: $APK"
        cp "$APK" "dist/FileManager-${{ github.ref_name }}-${{ github.run_number }}.apk"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: filemanager-apk
        path: dist/*.apk

    - name: Publish GitHub pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}-${{ github.run_number }}
        name: ${{ github.ref_name }} build ${{ github.run_number }}
        prerelease: true
        target_commitish: ${{ github.sha }}
        files: dist/*.apk
